<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>重置你的 INSPIRA 密码</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f5f5;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;,
        &quot;Microsoft YaHei&quot;, Helvetica, Arial, sans-serif;
      color: #171717;
    "
  >
    <!--
      INSPIRA 密码重置邮件。

      为什么链接必须指向我们自己的域名（ADR-0007）：
      Supabase 默认模板用的是 {{ .ConfirmationURL }}，它的主机是认证服务本身
      （本地实测为 127.0.0.1:54321，生产会是 <项目>.supabase.co）。
      而主规格第 5.4 节要求大陆用户在不使用 VPN 的情况下也能打开邮件里的链接。
      把链接直接指向自有域名，可以避免依赖一个未经测试的境外域名。

      因此这里使用 {{ .TokenHash }}，由我们自己的 /auth/confirm 路由完成校验。

      另外：模板内**不得**引用任何外部资源（图片、字体、样式表），
      与主规格第 5.4 节对页面资源的要求一致。以下全部使用内联样式。
    -->
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px"
    >
      <tr>
        <td style="padding: 32px 28px">
          <h1 style="margin: 0 0 16px; font-size: 20px; line-height: 1.4">重置你的 INSPIRA 密码</h1>

          <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.7">
            我们收到了重置这个邮箱密码的请求。点击下面的按钮设置新密码。
          </p>

          <p style="margin: 0 0 24px">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
              style="
                display: inline-block;
                padding: 12px 20px;
                background: #171717;
                color: #ffffff;
                border-radius: 8px;
                text-decoration: none;
                font-size: 15px;
              "
            >
              设置新密码
            </a>
          </p>

          <p style="margin: 0 0 16px; font-size: 13px; line-height: 1.7; color: #666666">
            如果按钮无法点击，请把下面这个地址完整复制到浏览器打开：
          </p>
          <p
            style="
              margin: 0 0 24px;
              font-size: 13px;
              line-height: 1.7;
              word-break: break-all;
              color: #666666;
            "
          >
            {{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery
          </p>

          <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #666666">
            如果这不是你本人的操作，可以忽略这封邮件，你的密码不会被更改。
          </p>
        </td>
      </tr>
    </table>

    <p
      style="
        max-width: 560px;
        margin: 16px auto 0;
        font-size: 12px;
        line-height: 1.6;
        color: #999999;
        text-align: center;
      "
    >
      INSPIRA 辩论俱乐部管理系统
    </p>
  </body>
</html>
